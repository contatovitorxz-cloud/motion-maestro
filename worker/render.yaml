services:
  - type: web
    name: motiona-remotion-worker
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: NODE_ENV
        value: production
